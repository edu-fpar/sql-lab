<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SQL Lab – Visite guidée</title>
<style>
/* Page de présentation vidéo de SQL Lab.
   Un seul fichier, aucune bibliothèque : la « vidéo » est dessinée sur un canvas
   (API Canvas 2D) et la voix vient de la synthèse vocale du navigateur (Web Speech API).
   Couleurs reprises de assets/style.css pour rester dans l'identité de l'application. */
:root{
 --bg:#f5f6f8;--surface:#fff;--surface-2:#f0f2f5;--border:#dde1e7;--text:#1d2330;--muted:#5d6676;
 --accent:#1f5fbf;--accent-soft:#e5eefb;--ok:#1d7a46;--ok-soft:#e4f4ea;--warn:#9a5b00;--warn-soft:#fdf1dc;
 --ko:#b3261e;--ko-soft:#fbe7e5;--code-bg:#f6f8fa;--radius:12px;
 --mono:ui-monospace,"Cascadia Code",Consolas,"Liberation Mono",monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{
 --bg:#14171c;--surface:#1c2027;--surface-2:#242933;--border:#333a46;--text:#e6e9ef;--muted:#9aa3b2;
 --accent:#6ea1ff;--accent-soft:#1f2d47;--ok:#5cc98a;--ok-soft:#173325;--warn:#f0b45a;--warn-soft:#3a2c14;
 --ko:#ff8a80;--ko-soft:#3d1d1b;--code-bg:#181c22;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
code{font-family:var(--mono);background:var(--code-bg);padding:0 .3em;border-radius:4px;font-size:.92em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
button{font:inherit;color:inherit}

/* ---------- bandeau ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:68px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;margin-right:auto}
.logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(#2f74d8,#1f5fbf);color:#fff;display:grid;place-items:center;font:800 13px system-ui;letter-spacing:.02em}
.brand b{display:block;font-size:18px}
.brand small{display:block;color:var(--muted);font-size:13px}
.langs{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.langs button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.langs button[aria-pressed=true]{background:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;text-decoration:none;color:var(--text);cursor:pointer;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0b1220}}
.btn svg,.tb svg,.ib svg{width:18px;height:18px}

/* ---------- en-tête ---------- */
.hero{padding:36px 0 20px}
.hero h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.02em}
.hero p{color:var(--muted);max-width:760px;margin-top:8px}

/* ---------- lecteur ---------- */
.player{position:relative;border-radius:var(--radius);overflow:hidden;background:#071226;aspect-ratio:16/9;box-shadow:0 12px 40px rgba(7,18,38,.25)}
.player canvas{display:block;width:100%;height:100%;cursor:pointer}
.big{position:absolute;inset:0;margin:auto;width:92px;height:92px;border-radius:50%;border:0;background:rgba(31,95,191,.92);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.big svg{width:40px;height:40px;margin-left:5px}
.end{position:absolute;left:0;right:0;bottom:9%;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.end .btn{font-size:17px;padding:12px 20px}
.end .ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.cap{min-height:3.2em;margin:12px 0 4px;text-align:center;font-size:18px;font-weight:500;text-wrap:balance}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ib,.tb{border:1px solid var(--border);background:var(--surface);border-radius:8px;height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.ib{width:44px}
.tb{padding:0 12px;font-size:14px;font-weight:600}
.tb[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.prog{flex:1 1 240px;position:relative;height:40px;cursor:pointer;touch-action:none}
.prog::before{content:"";position:absolute;left:0;right:0;top:17px;height:6px;border-radius:3px;background:var(--border)}
.fill{position:absolute;left:0;top:17px;height:6px;border-radius:3px;background:var(--accent);pointer-events:none}
.mk{position:absolute;top:13px;width:2px;height:14px;background:var(--muted);opacity:.55;pointer-events:none}
.time{font:600 14px var(--mono);color:var(--muted);min-width:96px;text-align:center}
.chaps{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chaps button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;color:var(--muted)}
.chaps button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.chaps button[aria-current=true]{color:#0b1220}}

/* ---------- coulisses (mode d'observation de l'animation) ---------- */
.dbgp{margin-top:14px;border:1px dashed var(--accent);border-radius:var(--radius);background:var(--surface);padding:14px 16px;font:13px/1.5 var(--mono)}
.dbgp .hd{font-weight:700;color:var(--accent);margin-bottom:8px;font-size:14px}
.dbgp .hint{color:var(--muted);font-family:system-ui,sans-serif;margin-bottom:10px}
.dbgp .row{display:grid;grid-template-columns:150px 120px 1fr 48px;gap:10px;align-items:center}
.dbgp .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.dbgp .bar i{display:block;height:100%;background:var(--accent)}
.dbgp .row.on{color:var(--text)}.dbgp .row.off{color:var(--muted);opacity:.6}
.dbgp .row.done .bar i{background:var(--ok)}

/* ---------- outils ---------- */
section.blk{padding:44px 0 8px}
section.blk h2{font-size:26px;letter-spacing:-.01em}
section.blk>.wrap>p{color:var(--muted);margin:6px 0 20px;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:18px;display:flex;align-items:center;gap:10px}
.card h3 .n{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:14px;flex:none}
.card p{margin:0;color:var(--muted);font-size:15px}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.card .acts .btn{font-size:14px;padding:6px 12px}
.making{display:grid;gap:12px;padding:0;margin:0;list-style:none}
.making li{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.making li b.k{width:34px;height:34px;border-radius:9px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:15px}
.making li span{color:var(--muted)}
.making li strong{color:var(--text)}
footer{padding:40px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:18px}
@media (max-width:640px){.dbgp .row{grid-template-columns:110px 1fr 44px}.dbgp .row .rg{display:none}.cap{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- page intégrée (iframe) : ?embed=app (accueil de l'application) ou ?embed=doc (documentation) ---------- */
.embed .top,.embed .hero,.embed section.blk,.embed footer,.embed .langs{display:none!important}
.embedbar{display:none}
.embed-app{--bg:#071226;--surface:#1c2027;--surface-2:#242933;--border:#333a46;--text:#e6e9ef;--muted:#9aa3b2;--accent:#6ea1ff;--accent-soft:#1f2d47;--ok:#5cc98a;--ok-soft:#173325;color-scheme:dark;background:#071226;color:#e6e9ef;min-height:100vh}
.embed-app .wrap{max-width:min(1180px,calc((100vh - 230px) * 16 / 9))}
.embed-app .embedbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.embed-app .embedbar .brand{margin:0}
.embed-app .embedbar .brand small{color:#9aa3b2}
.embed-app .player{box-shadow:none}
.skip{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.skip svg{width:16px;height:16px}
/* la documentation est en thème clair : la vidéo intégrée le suit, même si le système est en sombre */
.embed-doc{--bg:#fff;--surface:#fff;--surface-2:#f0f2f5;--border:#dde1e7;--text:#1d2330;--muted:#5d6676;--accent:#1f5fbf;--accent-soft:#e5eefb;--ok:#1d7a46;--ok-soft:#e4f4ea;color-scheme:light;background:transparent;color:#1d2330}
:root:has(.embed-doc){color-scheme:light;overflow:hidden}
.embed-doc .wrap{max-width:none;padding:0}
.embed-doc .player{box-shadow:none}
</style>
</head>

 </section>

 /* ---------- outils de temps : progression et courbes d'accélération ---------- */
 const cp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
 const eo  = x => 1 - Math.pow(1 - x, 3);                                    // easeOutCubic : démarre vite, freine
 const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; // easeInOutCubic : doux aux deux bouts
 const bk  = x => { if (x <= 0) return 0; const c1 = 1.70158, c3 = c1 + 1;    // easeOutBack : petit rebond
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
 let TW = null, S0 = 0;  // journal des « coulisses » et début de la scène en cours
 /* sg(k, a, b, nom) : progression de 0 à 1 entre les instants a et b (en secondes depuis le début de la scène).
    Quand un nom est donné et que les coulisses sont ouvertes, la progression est notée dans le journal. */
 function sg(k, a, b, name) { const v = cp((k - a) / (b - a)); if (TW && name) TW.push([name, S0 + a, S0 + b, v]); return v; }

  rr(c, x0, y, w, h, h / 2); c.fillStyle = bg; c.fill(); tx(c, s, x0 + w / 2, y + h / 2 + 1, f, fg, "center", "middle"); return w; }

  rr(c, x, y, w, h, r); c.fillStyle = C.surf; c.fill(); }

 /* fond : dégradé bleu nuit, grille de points qui glisse lentement, halo */
 function bg(c, t) { const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg2); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = "rgba(255,255,255,.07)"; const ox = -(t * 6) % 32, oy = -(t * 3) % 32;
  for (let x = ox; x < W; x += 32) for (let y = oy; y < H; y += 32) c.fillRect(Math.round(x), Math.round(y), 2, 2);
  const r = c.createRadialGradient(W * .8, H * .08, 0, W * .8, H * .08, 780); r.addColorStop(0, "rgba(110,161,255,.2)"); r.addColorStop(1, "rgba(110,161,255,0)");
  c.fillStyle = r; c.fillRect(0, 0, W, H); }

 const KW = new Set("SELECT DISTINCT FROM WHERE AND OR NOT IN IS NULL GROUP BY HAVING ORDER ASC DESC INNER JOIN ON AS LIKE COUNT SUM AVG MIN MAX".split(" "));
 function sql(c, s, x, y, size) { const re = /'[^']*'?|[A-Za-z_][A-Za-z0-9_]*|\d+(?:\.\d+)?|\s+|./g; let m; c.textAlign = "left"; c.textBaseline = "alphabetic";
  while ((m = re.exec(s))) { const w = m[0]; let col = C.ink, wt = 400;
   if (w[0] == "'") col = C.ok; else if (/^[A-Za-z]/.test(w) && KW.has(w.toUpperCase())) { col = C.accent; wt = 700; } else if (/^\d/.test(w)) col = C.pur;

  let cx = x + 44, cy = y + 11 + lh * .72;
  lines.forEach((l, i) => { const top = y + 11 + lh * i, ly = top + lh * .72;
   if (o.hl && o.hl[i]) { c.save(); c.globalAlpha *= o.hl[i]; c.fillStyle = o.hlCol || "rgba(29,122,70,.14)"; c.fillRect(x + 2, top, w - 4, lh); c.restore(); }
   tx(c, String(i + 1), x + 28, ly, fnt(400, size - 3, FM), "#9aa3b2", "right"); cx = sql(c, l, x + 44, ly, size); cy = ly; });
  return { cx, cy, h, lh }; }

 /* bouton d'interface (enfoncé brièvement quand press passe de 0 à 1) */
 function button(c, s, x, y, primary, press, size = 16) { c.font = fnt(600, size); const w = c.measureText(s).width + 34, h = size * 2.4;
  const sc = press > 0 && press < 1 ? 1 - .07 * Math.sin(press * Math.PI) : 1; c.save(); c.translate(x + w / 2, y + h / 2); c.scale(sc, sc);

 const colInfo = s => { const pk = s.includes("_"), fk = s.includes("#"); return { pk, fk, n: s.replace(/[_#]/g, "") }; };
 const TW_ = {};  // largeurs mesurées une fois
 function geo(c, key, x, y) { const T = TB[key];
  if (!TW_[key]) { c.font = fnt(400, 14); let w = c.measureText(T.n).width + 40; T.cols.forEach(s => { w = Math.max(w, c.measureText((colInfo(s).fk ? "#" : "") + colInfo(s).n).width + 34); }); TW_[key] = Math.max(150, Math.ceil(w)); }
  const w = TW_[key], h = 34 + 12 + T.cols.length * 24;
  return { key, x, y, w, h, row: i => y + 34 + 6 + i * 24 + 12, idx: n => T.cols.findIndex(s => colInfo(s).n == n) }; }
 /* o.border : "lit" (table utile), "pass" (table de passage, pointillés), "dim" (estompée) ; o.roles : {colonne: "show"|"filter"|"join"} ; o.strike : {colonne: 0..1} */

  if (o.border == "lit") { c.shadowColor = "rgba(31,95,191,.35)"; c.shadowBlur = 14; }

    if (role == "join") { c.strokeStyle = C.ok; c.lineWidth = 1.4; c.stroke(); } }
   const label = (ci.fk ? "#" : "") + ci.n, f = fnt(ci.pk ? 600 : 400, 14).replace(/^/, ci.fk ? "italic " : "");
   const st = o.strike && o.strike[ci.n] || 0; c.save(); if (st) c.globalAlpha *= 1 - .55 * st;

 /* tracé d'une flèche clé étrangère → clé primaire, en angles droits */

  if (gb.x + gb.w < ga.x - 16) { const x1 = ga.x, x2 = gb.x + gb.w, m = (x1 + x2) / 2; return [[x1, ya], [m, ya], [m, yb], [x2, yb]]; }
  if (gb.x > ga.x + ga.w + 16) { const x1 = ga.x + ga.w, x2 = gb.x, m = (x1 + x2) / 2; return [[x1, ya], [m, ya], [m, yb], [x2, yb]]; }

  for (let i = 1; i < pts.length && rest > 0; i++) { const f = Math.min(1, rest / L[i - 1]); end = [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f]; c.lineTo(end[0], end[1]); rest -= L[i - 1]; }

  watch:"Ver", docs:"Documentación",
  tools:[
   ["Editor y ejecución",1,"Resaltado de sintaxis y autocompletado de tablas y columnas (CodeMirror 5). La consulta se ejecuta con SQLite compilado a WebAssembly (sql.js): todo ocurre en el navegador, sin servidor. Las consultas de escritura parten de una copia nueva de la base.",["requetes"]],
   ["Comparación y diagnóstico",2,"El resultado se compara con el esperado, con tolerancias (alias, orden de columnas, mayúsculas, redondeo). Si hay diferencias, un consejo preciso: combinación olvidada, duplicados, orden, = NULL, agregado en WHERE. Las fechas «estilo DCG» (YEAR(), #15/06/2024#) se reescriben para SQLite.",["requetes"]],

   ["Solución paso a paso",4,"El razonamiento reproducido en el orden en que se hace: tablas, tablas intermedias, alias, columnas, combinaciones, filtros, agrupación, ordenación. Los pasos se generan a partir de la solución; el docente puede añadir sus comentarios.",["pas-a-pas"]],

  ],
  docNames:{requetes:"Consultas",schema:"Esquema",processus:"Procesos","pas-a-pas":"Paso a paso","questions-ia":"Preguntas e IA",partage:"Compartir",scorm:"SCORM"},
  makeT:"Cómo está hecho este vídeo", makeP:"Ningún archivo de vídeo, ninguna biblioteca: todo cabe en intro.html, junto a la aplicación.",
  make:[["1","Un canvas redibujado","Cada imagen se dibuja con la API Canvas 2D del navegador, unas 60 veces por segundo: rectángulos redondeados, texto, degradados. No hay elementos que inspeccionar, solo píxeles."],
   ["2","Una función del tiempo","draw(t) dibuja la imagen del instante t, y nada más cuenta. Eso permite retroceder, avanzar y saltar a los capítulos."],

   ["5","Los entresijos","El botón Entresijos (tecla D) muestra la escena, el tiempo y el progreso de cada animación. En pausa, las teclas , y . avanzan imagen por imagen."]],
  dbgHint:"Cada fila es una animación con nombre en el código: su intervalo (inicio → fin) y su progreso. En pausa: , y . para avanzar imagen por imagen, ← → para 5 s.",

};
let LANG = "fr";
/* Mode intégré : ?embed=app (vidéo d'accueil dans l'application) ou ?embed=doc (dans la documentation) */
const EMBED = (p => ["app", "doc"].includes(p) ? p : "")(new URLSearchParams(location.search).get("embed"));
/* « Ouvrir l'application » : l'exercice de démonstration dans la langue choisie */
const APP = { fr:"index.html?lang=fr", en:"index.html?lang=en#demo-en/intro", es:"index.html?lang=es#demo-es/intro" };
const t = k => (UI[LANG][k] !== undefined ? UI[LANG][k] : UI.fr[k]);
const docUrl = key => LANG == "fr" ? DOC.fr + key : DOC[LANG] + ((DOCK[key] || {})[LANG] || key);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ch]));

/* Langue : ?lang=, sinon le choix enregistré par l'application (même clé que assets/i18n.js), sinon le navigateur */
const LKEY = "sqllab:lang";
function detectLang() {
 const u = new URLSearchParams(location.search).get("lang"); if (["fr", "en", "es"].includes(u)) return u;
 try { const s = JSON.parse(localStorage.getItem(LKEY)); if (["fr", "en", "es"].includes(s)) return s; } catch (e) { /* stockage indisponible */ }
 const n = navigator.language || "fr"; return /^es\b/i.test(n) ? "es" : /^fr\b/i.test(n) ? "fr" : "en";
}

/* =====================================================================
   LECTEUR
   ===================================================================== */
const ICON = { play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>', pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>' };
const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const VP = { t:0, playing:false, last:0, snd:false, cap:-1, ctx:null, raf:0, dbg:false };
const hasTTS = typeof speechSynthesis != "undefined" && typeof SpeechSynthesisUtterance != "undefined";
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function stopSpeech() { try { if (hasTTS) speechSynthesis.cancel(); } catch (e) { /* rien */ } }
function speak(s) { try { if (!hasTTS) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(s), loc = { fr:"fr-FR", en:"en-US", es:"es-ES" }[LANG];
 u.lang = loc; u.rate = 1.05; const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(LANG)); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) { /* rien */ } }
function setup() { const cv = $("cv"), k = Math.min(2, window.devicePixelRatio || 1); cv.width = INTRO.W * k; cv.height = INTRO.H * k;
 VP.ctx = cv.getContext("2d"); VP.ctx.setTransform(k, 0, 0, k, 0, 0);
 $("marks").innerHTML = INTRO.CH.fr.slice(1).map(c => `<span class="mk" style="left:${c[0] / INTRO.DUR * 100}%"></span>`).join("");
 if (!hasTTS) $("snd").hidden = true; }
function render() { if (!VP.ctx) return; const tt = VP.t, D = INTRO.DUR, log = VP.dbg ? [] : null;
 try { INTRO.draw(VP.ctx, tt, LANG, log); } catch (e) { console.error(e); }
 $("fill").style.width = (tt / D * 100) + "%"; $("time").textContent = `${mmss(tt)} / ${mmss(D)}`; $("prog").setAttribute("aria-valuenow", Math.round(tt));
 const caps = INTRO.CAP[LANG], ci = caps.findIndex(c => tt >= c[0] && tt < c[1]);
 if (ci !== VP.cap) { VP.cap = ci; $("cap").textContent = ci >= 0 ? caps[ci][2] : ""; if (ci >= 0 && VP.snd && VP.playing) speak(caps[ci][2]); }
 let ch = 0; INTRO.CH[LANG].forEach((c, i) => { if (tt >= c[0]) ch = i; });
 document.querySelectorAll("#chaps button").forEach((b, i) => b.setAttribute("aria-current", i == ch));
 if (VP.dbg) renderDbg(tt, log); }
/* coulisses : scène en cours et journal des animations nommées */
function renderDbg(tt, log) { const sc = INTRO.sceneAt(tt);
 const rows = log.map(([n, a, b, v]) => `<div class="row ${v >= 1 ? "done on" : v > 0 ? "on" : "off"}"><span>${esc(n)}</span><span class="rg">${a.toFixed(2)} → ${b.toFixed(2)} s</span><span class="bar"><i style="width:${(v * 100).toFixed(1)}%"></i></span><span>${v.toFixed(2)}</span></div>`).join("");
 $("dbgp").innerHTML = `<div class="hd">t = ${tt.toFixed(2)} s · ${t("scene")} ${esc(sc[3])} (${sc[0]} → ${Math.min(INTRO.DUR, sc[1]).toFixed(0)} s, k = ${(tt - sc[0]).toFixed(2)} s)</div><div class="hint">${esc(t("dbgHint"))}</div>${rows}`; }
function loop(now) { if (!VP.playing) return; VP.t = Math.min(INTRO.DUR, VP.t + (now - VP.last) / 1000); VP.last = now; render();
 if (VP.t >= INTRO.DUR) { pause(); $("end").hidden = false; } else VP.raf = requestAnimationFrame(loop); }
function play() { if (VP.t >= INTRO.DUR - .05) { VP.t = 0; VP.cap = -1; } $("end").hidden = true; $("big").hidden = true; VP.playing = true; VP.last = performance.now();
 $("play").innerHTML = ICON.pause; $("play").setAttribute("aria-label", t("pause")); cancelAnimationFrame(VP.raf); VP.raf = requestAnimationFrame(loop); }
function pause() { VP.playing = false; cancelAnimationFrame(VP.raf); $("play").innerHTML = ICON.play; $("play").setAttribute("aria-label", t("play")); stopSpeech(); }
function seek(x) { VP.t = Math.max(0, Math.min(INTRO.DUR, x)); VP.cap = -1; stopSpeech(); if (VP.t < INTRO.DUR) $("end").hidden = true; render(); }

/* =====================================================================
   PAGE : langue, chapitres, cartes des outils, coulisses
   ===================================================================== */
function applyLang() {
 document.documentElement.lang = LANG; document.title = "SQL Lab – " + t("tagline");
 document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t(e.dataset.t); });
 document.querySelectorAll("[data-ta]").forEach(e => e.setAttribute("aria-label", t(e.dataset.ta)));
 document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang == LANG));
 document.querySelectorAll("[data-app]").forEach(a => { a.setAttribute("href", APP[LANG]); if (EMBED == "doc") a.target = "_top"; });
 $("play").setAttribute("aria-label", VP.playing ? t("pause") : t("play"));
 $("chaps").innerHTML = INTRO.CH[LANG].map(c => `<button type="button" data-sec="${c[0]}">${esc(c[1])}</button>`).join("");
 $("tools").innerHTML = t("tools").map(([title, ch, txt, docs], i) => `<article class="card"><h3><span class="n">${i + 1}</span>${esc(title)}</h3><p>${esc(txt)}</p>
  <div class="acts"><button class="btn" type="button" data-sec="${INTRO.CH.fr[ch][0]}">${ICON.play}${esc(t("watch"))}</button>${docs.map(d => `<a class="btn" href="${docUrl(d)}">${esc(t("docs"))} · ${esc(t("docNames")[d])}</a>`).join("")}</div></article>`).join("");
 $("make").innerHTML = t("make").map(([n, a, b]) => `<li><b class="k">${n}</b><div><strong>${esc(a)}</strong><br><span>${esc(b)}</span></div></li>`).join("");
 VP.cap = -1; render(); }
function setLang(l) { LANG = l; try { localStorage.setItem(LKEY, JSON.stringify(l)); } catch (e) { /* rien */ } stopSpeech(); applyLang(); }

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
document.addEventListener("click", e => { const b = e.target.closest("[data-sec]"); if (!b) return; seek(+b.dataset.sec + .01); if (!VP.playing) play();
 if (!b.closest("#chaps") && !EMBED) document.querySelector(".player").scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "center" }); });
$("play").addEventListener("click", () => VP.playing ? pause() : play());
$("cv").addEventListener("click", () => VP.playing ? pause() : play());
$("big").addEventListener("click", play);
$("replay").addEventListener("click", () => { seek(0); play(); });
$("snd").addEventListener("click", () => { VP.snd = !VP.snd; $("snd").setAttribute("aria-pressed", VP.snd);
 if (VP.snd) { const c = INTRO.CAP[LANG].find(c => VP.t >= c[0] && VP.t < c[1]); if (c) speak(c[2]); if (!VP.playing) play(); } else stopSpeech(); });
function toggleDbg() { VP.dbg = !VP.dbg; $("dbg").setAttribute("aria-pressed", VP.dbg); $("dbgp").hidden = !VP.dbg; render(); }
$("dbg").addEventListener("click", toggleDbg);
{ let drag = false; const pr = $("prog"), at = e => { const r = pr.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * INTRO.DUR); };
 pr.addEventListener("pointerdown", e => { drag = true; try { pr.setPointerCapture(e.pointerId); } catch (_) { /* rien */ } at(e); });
 pr.addEventListener("pointermove", e => { if (drag) at(e); });
 pr.addEventListener("pointerup", () => { drag = false; }); pr.addEventListener("pointercancel", () => { drag = false; }); }
document.addEventListener("keydown", e => { if (e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
 if (e.key == " " && !/^(BUTTON|A)$/.test(e.target.tagName)) { VP.playing ? pause() : play(); e.preventDefault(); }
 else if (e.key == "ArrowRight" || e.key == "ArrowLeft") { seek(VP.t + (e.key == "ArrowRight" ? 5 : -5)); e.preventDefault(); }
 else if ((e.key == "," || e.key == ".") && !VP.playing) { seek(VP.t + (e.key == "." ? 1 : -1) / 30); e.preventDefault(); }   // image par image
 else if (e.key == "d" || e.key == "D") toggleDbg();
 else if (e.key == "Escape" && EMBED == "app") closeEmbed(); });
/* fermeture demandée à l'application (assets/intro-launcher.js écoute ce message) */
function closeEmbed() { pause(); try { parent.postMessage({ sqllab: "intro-close" }, location.origin); } catch (e) { /* rien */ } }
$("skip").addEventListener("click", closeEmbed);
$("start").addEventListener("click", closeEmbed);

/* démarrage : lecture automatique sauf si l'utilisateur limite les animations */
if (EMBED) document.body.classList.add("embed", "embed-" + EMBED);
if (EMBED == "doc" && window.ResizeObserver) new ResizeObserver(() => { try { parent.postMessage({ sqllab: "intro-height", h: document.documentElement.scrollHeight }, location.origin); } catch (e) { /* rien */ } }).observe(document.body);
if (EMBED == "app") { $("start").hidden = false; document.querySelector(".end [data-app]").hidden = true; }
try { localStorage.setItem("sqllab:introSeen", "1"); } catch (e) { /* vue : l'application ne la relancera pas d'elle-même */ }
LANG = detectLang(); setup(); applyLang();
if (RM || EMBED == "doc") { VP.t = 2.6; render(); $("big").hidden = false; $("play").innerHTML = ICON.play; } else play();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!VP.playing) render(); });
if (hasTTS && speechSynthesis.getVoices().length == 0) speechSynthesis.addEventListener("voiceschanged", () => {}, { once: true });
}
</script>
</body>
